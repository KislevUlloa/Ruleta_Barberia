<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>¡Gira y gana!</title>
<style>
  :root { color-scheme: dark; --gold:#f7c948; --pink:#ff4f81; --muted:#b8b8b8; }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; }
  body {
    background: #050505; color:#fff; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display:flex; justify-content:center; align-items:center; padding:24px 16px;
  }
  .page { width:min(100%, 780px); text-align:center; }
  .eyebrow { text-transform:uppercase; letter-spacing:.24em; color:#e5c56b; font-size:.72rem; font-weight:800; margin:0 0 10px; }
  h1 { font-size:clamp(2rem, 7vw, 3.7rem); margin:0; line-height:1.02; letter-spacing:-.045em; }
  h1 span { color:var(--gold); }
  .intro { color:#c8c8c8; margin:14px auto 24px; max-width:480px; line-height:1.5; font-size:clamp(.92rem, 2.7vw, 1.05rem); }
  .wheel-wrap { width:min(82vw, 510px); aspect-ratio:1; margin:0 auto 22px; position:relative; filter:drop-shadow(0 14px 24px #000b); }
  canvas { width:100%; height:100%; display:block; }
  .pointer {
    position:absolute; z-index:2; top:-5px; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:17px solid transparent; border-right:17px solid transparent;
    border-top:0; border-bottom:34px solid #fff; filter:drop-shadow(0 2px 3px #000);
  }
  .pointer::after { content:""; position:absolute; left:-7px; top:8px; border-left:7px solid transparent; border-right:7px solid transparent; border-bottom:15px solid var(--pink); }
  .spin {
    appearance:none; border:0; border-radius:999px; padding:16px 34px; min-width:min(100%, 260px);
    background:linear-gradient(135deg,#ffe27a,#f5ad28); color:#171000; font-weight:900; letter-spacing:.09em;
    font-size:1rem; cursor:pointer; box-shadow:0 7px 0 #9b6411, 0 12px 28px #f0b42b24; transition:transform .15s, filter .15s;
  }
  .spin:hover { filter:brightness(1.08); transform:translateY(-1px); }
  .spin:active { transform:translateY(3px); box-shadow:0 4px 0 #9b6411; }
  .spin:disabled { cursor:wait; opacity:.7; transform:none; }
  .hint { color:#8f8f8f; font-size:.78rem; margin:18px 0 0; }
  .result-backdrop { position:fixed; inset:0; background:#000c; display:none; align-items:center; justify-content:center; padding:20px; z-index:10; }
  .result-backdrop.show { display:flex; }
  .result-card { width:min(100%, 420px); border:1px solid #594a24; border-radius:24px; padding:30px 24px 24px; background:linear-gradient(155deg,#181818,#080808); box-shadow:0 20px 80px #000; animation:pop .28s ease-out; }
  .spark { font-size:2.3rem; margin-bottom:8px; }
  .result-card h2 { margin:0 0 10px; font-size:1.65rem; }
  .result-card p { color:#e0e0e0; line-height:1.5; margin:0 0 22px; }
  .result-card .spin { width:100%; }
  .close { background:transparent; color:#aaa; border:0; display:block; margin:18px auto 0; padding:8px 12px; cursor:pointer; }
  .status { min-height:1.4em; color:#f4d77a; font-size:.9rem; margin-top:15px; }
  @keyframes pop { from { opacity:0; transform:scale(.92) translateY(8px); } to { opacity:1; transform:scale(1) translateY(0); } }
  @media (max-width:480px) {
    body { padding:26px 12px 20px; }
    .intro { margin-bottom:22px; }
    .wheel-wrap { width:min(91vw, 430px); margin-bottom:24px; }
    .pointer { border-left-width:14px; border-right-width:14px; border-bottom-width:29px; }
    .spin { padding:15px 22px; }
  }
  @media (max-height:700px) and (orientation:landscape) {
    body { padding:12px; }
    .page { max-width:900px; }
    .wheel-wrap { width:min(52vh, 430px); margin-bottom:12px; }
    .intro { margin:8px auto 12px; }
    h1 { font-size:2rem; }
  }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>
<main class="page">
  <p class="eyebrow">Una sorpresa para ti</p>
  <h1>¡Gira y <span>gana!</span></h1>
  <p class="intro">Prueba tu suerte y descubre el detalle que tenemos para ti. ✨</p>
  <div class="wheel-wrap" aria-label="Ruleta de premios">
    <div class="pointer" aria-hidden="true"></div>
    <canvas id="wheel" width="900" height="900" role="img" aria-label="Ruleta con 19 segmentos de premios"></canvas>
  </div>
  <button class="spin" id="spinButton" type="button">GIRAR RULETA</button>
  <div class="status" id="status" aria-live="polite"></div>
  <p class="hint">¡Mucha suerte! 💫</p>
</main>

<div class="result-backdrop" id="resultBackdrop" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
  <div class="result-card">
    <div class="spark" aria-hidden="true">✨🎉✨</div>
    <h2 id="resultTitle">¡Felicidades!</h2>
    <p id="resultText"></p>
    <button class="spin" id="againButton" type="button">GIRAR DE NUEVO</button>
    <button class="close" id="closeButton" type="button">Cerrar</button>
  </div>
</div>

<script>
(() => {
  "use strict";
  const prizes = [
    { name: "Perfilado de ceja", count: 2 },
    { name: "Mascarilla", count: 2 },
    { name: "Exfoliación", count: 2 },
    { name: "Masaje relajante", count: 4 },
    { name: "Dulce", count: 4 },
    { name: "Masaje facial", count: 4 },
    { name: "$20 pesos menos en tu cobro", count: 1, discount: true }
  ];

  // Se crea un segmento visual por unidad: 19 segmentos del mismo tamaño.
  const segments = [];
  prizes.forEach(prize => {
    for (let i = 0; i < prize.count; i++) segments.push(prize);
  });

  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const spinButton = document.getElementById("spinButton");
  const status = document.getElementById("status");
  const backdrop = document.getElementById("resultBackdrop");
  const resultText = document.getElementById("resultText");
  const againButton = document.getElementById("againButton");
  const closeButton = document.getElementById("closeButton");

  const palette = ["#e63946", "#151515", "#f4c542", "#2864dc", "#159b72", "#ff6b35", "#7a3db8", "#f05b9b"];
  const TAU = Math.PI * 2;
  const step = TAU / segments.length;
  let rotation = 0;
  let spinning = false;

  function randomUnit() {
    // Usa Web Crypto cuando está disponible.
    if (window.crypto && crypto.getRandomValues) {
      const arr = new Uint32Array(1);
      crypto.getRandomValues(arr);
      return arr[0] / 4294967296;
    }
    return Math.random();
  }

  function chooseWinnerIndex() {
    // 3 % para el descuento; 97 % distribuido entre los otros 18 segmentos.
    if (randomUnit() < 0.03) {
      return segments.findIndex(s => s.discount);
    }
    const eligible = segments.map((s, i) => ({s, i})).filter(x => !x.s.discount);
    return eligible[Math.floor(randomUnit() * eligible.length)].i;
  }

  function drawWheel() {
    const size = canvas.width;
    const center = size / 2;
    const radius = size / 2 - 18;
    ctx.clearRect(0, 0, size, size);

    // Aro exterior metálico.
    ctx.beginPath();
    ctx.arc(center, center, radius + 5, 0, TAU);
    ctx.fillStyle = "#d5b45b";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(center, center, radius - 1, 0, TAU);
    ctx.fillStyle = "#101010";
    ctx.fill();

    ctx.save();
    ctx.translate(center, center);
    ctx.rotate(rotation - Math.PI / 2);

    segments.forEach((segment, i) => {
      const start = i * step;
      const end = start + step;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, radius - 8, start, end);
      ctx.closePath();
      ctx.fillStyle = segment.discount ? "#f7c948" : palette[i % palette.length];
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2.2;
      ctx.stroke();

      // Etiquetas breves y en varias líneas para evitar que se encimen.
      // Se colocan siguiendo el radio del segmento, con texto centrado.
      ctx.save();
      const mid = start + step / 2;
      ctx.rotate(mid);
      ctx.translate(radius * 0.66, 0);
      ctx.rotate(Math.PI / 2);

      ctx.fillStyle = segment.discount ? "#161006" : "#fff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = segment.discount ? "transparent" : "#000b";
      ctx.shadowBlur = segment.discount ? 0 : 3;
      ctx.lineJoin = "round";
      ctx.strokeStyle = segment.discount ? "#f7c948" : "#0008";
      ctx.lineWidth = 1.5;

      const labels = {
        "Perfilado de ceja": ["Perfilado", "de ceja"],
        "Mascarilla": ["Mascarilla"],
        "Exfoliación": ["Exfoliación"],
        "Masaje relajante": ["Masaje", "relajante"],
        "Dulce": ["Dulce"],
        "Masaje facial": ["Masaje", "facial"],
        "$20 pesos menos en tu cobro": ["$20 MENOS", "en tu cobro"]
      };
      const lines = labels[segment.name] || [segment.name];
      const fontSize = segment.discount ? 17 : 20;
      ctx.font = `800 ${fontSize}px Arial, sans-serif`;
      const lineHeight = fontSize * 1.12;
      const firstY = -((lines.length - 1) * lineHeight) / 2;

      lines.forEach((line, lineIndex) => {
        const y = firstY + lineIndex * lineHeight;
        ctx.strokeText(line, 0, y, 150);
        ctx.fillText(line, 0, y, 150);
      });
      ctx.restore();
    });

    // Centro decorativo.
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.145, 0, TAU);
    ctx.fillStyle = "#080808";
    ctx.fill();
    ctx.strokeStyle = "#f7c948";
    ctx.lineWidth = 7;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.105, 0, TAU);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = "#f7c948";
    ctx.font = "900 34px Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("★", 0, 1);
    ctx.restore();
  }

  function normalizeAngle(a) {
    return ((a % TAU) + TAU) % TAU;
  }

  function spin() {
    if (spinning) return;
    spinning = true;
    spinButton.disabled = true;
    againButton.disabled = true;
    backdrop.classList.remove("show");
    status.textContent = "La ruleta está girando…";
    const winnerIndex = chooseWinnerIndex();

    // Centra el segmento ganador bajo el puntero fijo de las 12.
    const targetRotation = normalizeAngle(-(winnerIndex + 0.5) * step);
    const current = normalizeAngle(rotation);
    const delta = normalizeAngle(targetRotation - current);
    const extraTurns = 5 + Math.floor(randomUnit() * 3);
    const startRotation = rotation;
    const endRotation = rotation + extraTurns * TAU + delta;
    const duration = 4800 + randomUnit() * 700;
    const startTime = performance.now();

    function animate(now) {
      const t = Math.min(1, (now - startTime) / duration);
      // Ease-out cúbico: gira rápido y se detiene suavemente.
      const eased = 1 - Math.pow(1 - t, 3);
      rotation = startRotation + (endRotation - startRotation) * eased;
      drawWheel();
      if (t < 1) {
        requestAnimationFrame(animate);
      } else {
        rotation = endRotation;
        drawWheel();
        spinning = false;
        spinButton.disabled = false;
        againButton.disabled = false;
        const winner = segments[winnerIndex];
        status.textContent = "¡Tenemos un resultado!";
        resultText.textContent = winner.discount
          ? "¡Felicidades! Ganaste $20 MXN de descuento en tu cobro."
          : `¡Felicidades! Ganaste: ${winner.name}.`;
        backdrop.classList.add("show");
        againButton.focus();
      }
    }
    requestAnimationFrame(animate);
  }

  spinButton.addEventListener("click", spin);
  againButton.addEventListener("click", spin);
  closeButton.addEventListener("click", () => {
    backdrop.classList.remove("show");
    spinButton.focus();
  });
  backdrop.addEventListener("click", event => {
    if (event.target === backdrop) backdrop.classList.remove("show");
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape") backdrop.classList.remove("show");
  });

  drawWheel();
})();
</script>
</body>
</html>
